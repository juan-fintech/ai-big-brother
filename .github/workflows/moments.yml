name: Find moments
# Every hour: an AI model reads the finished hours and picks moments. Only this workflow gets the API key.
# The website shows the new moments after the next "Update the room" run (within about 10 minutes).

on:
  schedule:
    - cron: '17 * * * *'        # at 17 minutes past each hour
  workflow_dispatch:
    inputs:
      backlog_hours:
        description: 'Also look at this many past hours (0 = only the new hours)'
        required: false
        default: '0'

permissions:
  contents: read

concurrency:
  group: find-moments
  cancel-in-progress: false

jobs:
  moments:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Find moments (AI)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MODEL: ${{ vars.MODEL }}
          MOMENTS_MAX_CALLS: ${{ vars.MOMENTS_MAX_CALLS }}
          BACKLOG_HOURS: ${{ inputs.backlog_hours || '0' }}
        run: python3 scripts/find_moments.py

      - name: Save the moments
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/moments
          if git diff --cached --quiet; then echo "No new moments."; exit 0; fi
          git commit -q -m "Moments $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
